<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PALAK BEAUTY PARLER — Admin + Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8fb;color:#2b2028}
header{background:#8e145f;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:4}
.logo{font-weight:800;font-size:22px}.wrap{max-width:1100px;margin:auto;padding:25px 5%}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.tab{border:0;padding:11px 17px;border-radius:22px;cursor:pointer;font-weight:700}.tab.active{background:#8e145f;color:white}
.panel{background:white;padding:22px;border-radius:18px;box-shadow:0 5px 20px #00000012;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:6px}label{font-weight:700;font-size:14px}
button,.btn{border:0;background:#8e145f;color:white;padding:11px 16px;border-radius:10px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}
.secondary{background:#eee;color:#333}.danger{background:#b42318}.green{background:#218c4a}
.card{border:1px solid #eee;border-radius:14px;padding:14px;background:#fff}.pic{height:130px;border-radius:10px;background:#f5d8e8;display:flex;align-items:center;justify-content:center;font-size:55px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}
.price{font-weight:800;color:#8e145f;font-size:19px}.muted{color:#777;font-size:13px}
.hidden{display:none}.notice{padding:12px;background:#fff2b8;border-radius:10px;margin-bottom:15px}
@media(max-width:700px){.grid,.formgrid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<header><div><div class="logo">PALAK BEAUTY PARLER</div><small>Sarafa Bazar, Baktara</small></div><div>📞 8889659130</div></header>
<div class="wrap">
<div class="tabs">
<button class="tab active" onclick="show('store',this)">🛍️ Store</button>
<button class="tab" onclick="show('admin',this)">⚙️ Admin Panel</button>
</div>

<section id="store">
<div class="panel"><h1>Online Shopping Store</h1><p>Women Clothes • Cosmetics • Under Garments</p><div id="storeProducts" class="grid"></div></div>
</section>

<section id="admin" class="hidden">
<div class="notice">Demo Admin Panel: इस prototype में products आपके browser में save होते हैं। असली online store के लिए database/hosting लगाना होगा।</div>
<div class="panel">
<h2>➕ Product Add / Edit</h2>
<div class="formgrid">
<div><label>Product Name</label><input id="name" placeholder="जैसे Ladies Suit"></div>
<div><label>Category</label><select id="cat"><option>Women Clothes</option><option>Cosmetics</option><option>Under Garments</option></select></div>
<div><label>Price (₹)</label><input id="price" type="number" placeholder="999"></div>
<div><label>Stock</label><input id="stock" type="number" placeholder="10"></div>
<div><label>Photo</label><input id="photo" type="file" accept="image/*"></div>
</div><br>
<button onclick="saveProduct()">Save Product</button> <button class="secondary" onclick="clearForm()">Clear</button>
</div>
<div class="panel"><h2>📦 Your Products</h2><div id="adminProducts" class="grid"></div></div>
</section>
</div>
<script>
const KEY='palak_products_v1';
let products=JSON.parse(localStorage.getItem(KEY)||'[]');
let editId=null;
const icons={'Women Clothes':'👗','Cosmetics':'💄','Under Garments':'🩲'};
function persist(){localStorage.setItem(KEY,JSON.stringify(products));render();}
function show(id,el){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');render();}
function card(p,admin=false){return `<div class="card"><div class="pic">${p.photo?`<img src="${p.photo}">`:icons[p.cat]}</div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.cat)} • Stock: ${p.stock}</div><div class="price">₹${Number(p.price).toLocaleString('en-IN')}</div>${admin?`<br><button onclick="editProduct('${p.id}')">Edit</button> <button class="danger" onclick="delProduct('${p.id}')">Delete</button>`:`<br><button class="green" onclick="order('${p.id}')">WhatsApp Order</button>`}</div>`}
function render(){document.getElementById('storeProducts').innerHTML=products.length?products.map(p=>card(p)).join(''):'<p>अभी कोई product नहीं है। Admin Panel से जोड़ें।</p>';document.getElementById('adminProducts').innerHTML=products.length?products.map(p=>card(p,true)).join(''):'<p>अभी कोई product नहीं है।</p>';}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function clearForm(){editId=null;['name','price','stock'].forEach(id=>document.getElementById(id).value='');document.getElementById('photo').value='';}
function saveProduct(){
 const name=document.getElementById('name').value.trim(),cat=document.getElementById('cat').value,price=document.getElementById('price').value,stock=document.getElementById('stock').value,file=document.getElementById('photo').files[0];
 if(!name||!price){alert('Product name और price भरें।');return;}
 const finish=(photo)=>{
  if(editId){let p=products.find(x=>x.id===editId);Object.assign(p,{name,cat,price,stock});if(photo)p.photo=photo;}
  else products.unshift({id:Date.now().toString(),name,cat,price,stock,photo:photo||''});
  persist();clearForm();alert('Product save हो गया।');
 };
 if(file){let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file)}else finish('');
}
function editProduct(id){let p=products.find(x=>x.id===id);editId=id;name.value=p.name;cat.value=p.cat;price.value=p.price;stock.value=p.stock;window.scrollTo({top:0,behavior:'smooth'});}
function delProduct(id){if(confirm('यह product delete करें?')){products=products.filter(p=>p.id!==id);persist();}}
function order(id){let p=products.find(x=>x.id===id);let msg=encodeURIComponent(`Namaste PALAK BEAUTY PARLER, mujhe "${p.name}" (₹${p.price}) order karna hai.`);window.open('https://wa.me/918889659130?text='+msg,'_blank')}
render();
</script></body></html>
